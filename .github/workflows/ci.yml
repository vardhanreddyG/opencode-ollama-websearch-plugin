name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # dist/ is committed so Git installs work without a toolchain; fail if
      # a source change was pushed without rebuilding.
      - run: git diff --exit-code dist/
      # Live check against a headless OpenCode server (provider registration
      # and search require OLLAMA_API_KEY; skipped gracefully without it).
      - run: node scripts/smoke-test.mjs
        continue-on-error: true